<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nicole's PhD Seminar Bingo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;700&display=swap">
<style>
html{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}*,*::before,*::after{box-sizing:border-box}

/* Layout: one centered column — title, rules, a square 5x5 board that fills the phone width, footer slip text. */
:root{
  --bg:#f6f7fb; --surface:#ffffff; --ink:#14213d; --muted:#55607a;
  --line:#c9cfdd; --navy:#003262; --gold:#fdb515; --mark:#003262; --mark-ink:#fdb515;
  --display:"Alfa Slab One", Rockwell, "Roboto Slab", Georgia, serif;
  --body:"Archivo", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1526; --surface:#16213a; --ink:#eef1f8; --muted:#a3adc4;
  --line:#2f3d5c; --navy:#7fb2ea; --gold:#fdb515; --mark:#fdb515; --mark-ink:#0d1526; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1526; --surface:#16213a; --ink:#eef1f8; --muted:#a3adc4;
  --line:#2f3d5c; --navy:#7fb2ea; --gold:#fdb515; --mark:#fdb515; --mark-ink:#0d1526; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:400;color:var(--navy);font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.1;margin:0;text-align:center;text-wrap:balance}
.rules{margin:0;text-align:center;color:var(--muted);font-size:.95rem;line-height:1.45}
.board{display:grid;grid-template-columns:repeat(5,1fr);border:2px solid var(--ink);background:var(--surface);aspect-ratio:1/1;max-width:100%;width:100%}
.cell{appearance:none;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;color:var(--ink);
  font:500 clamp(.62rem,2.6vw,.98rem)/1.2 var(--body);padding:4px;display:flex;align-items:center;justify-content:center;text-align:center;
  cursor:pointer;min-width:0;overflow:hidden;hyphens:auto;overflow-wrap:break-word;transition:background .15s,color .15s;position:relative}
.cell:nth-child(5n){border-right:0}.cell:nth-child(n+21){border-bottom:0}
.cell:hover{background:color-mix(in srgb,var(--gold) 18%,transparent)}
.cell:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.cell.on{background:var(--mark);color:var(--mark-ink);font-weight:700}
.cell.win{box-shadow:inset 0 0 0 3px var(--gold)}
.cell.free{background:transparent;padding:3px}
.cell.free.on{background:var(--mark);padding:7px}
.cell.free img{width:100%;height:100%;object-fit:contain}
.status{min-height:1.6em;text-align:center;font-weight:700;color:var(--navy);font-size:1.05rem}
.status.bingo{font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--navy)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.meta code{font:700 .95rem var(--body);color:var(--ink);letter-spacing:.06em}
button.ghost{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .85rem var(--body);padding:7px 12px;border-radius:6px;cursor:pointer}
button.ghost:focus-visible{outline:3px solid var(--gold)}
.foot{margin:0;text-align:center;font-size:.92rem;line-height:1.45;color:var(--ink)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}
</style>

</head>
<body>
<div class="wrap" lang="en">
  <h1>Nicole's PhD Seminar Bingo!</h1>
  <p class="rules">Rules: Normal bingo rules apply. Mark phrases on your card when they are mentioned by Nicole or shown on her presentation. Enjoy!</p>
  <div class="board" id="board" role="grid" aria-label="Bingo card"></div>
  <div class="status" id="status" aria-live="polite">Tap a square to mark it.</div>
  <div class="meta">
    <span>Your card: <code id="cardId"></code></span>
    <span class="confirm"><button class="ghost" id="clearBtn" type="button">Clear marks</button><span class="confirm" id="ask" hidden><span>Clear all marks?</span><button class="ghost" id="yes" type="button">Clear</button><button class="ghost" id="no" type="button">Keep</button></span></span>
  </div>
  <p class="foot">Thank you for attending and for your support!</p>
</div>

const KEY="nicole-bingo-v1";

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffled(seed){const a=SQUARES.slice(),r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let state=null;
try{state=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
if(!state||typeof state.seed!=="number"){state={seed:Math.floor(Math.random()*900000)+100000,marks:[]}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
save();

const words=shuffled(state.seed);
const board=document.getElementById("board"),statusEl=document.getElementById("status");
document.getElementById("cardId").textContent=String(state.seed);
const marked=new Set(state.marks);
const cells=[];let k=0;
for(let i=0;i<25;i++){
  const b=document.createElement("button");b.type="button";b.className="cell";b.id="c"+i;
  if(i===12){b.classList.add("free");b.innerHTML='<img alt="">';b.firstChild.src=BEAR;b.setAttribute("aria-label","Free space")}
  else{b.textContent=words[k++]}
  b.addEventListener("click",()=>{marked.has(i)?marked.delete(i):marked.add(i);render()});
  board.appendChild(b);cells.push(b);
}
const LINES=[];for(let r=0;r<5;r++)LINES.push([0,1,2,3,4].map(c=>r*5+c));for(let c=0;c<5;c++)LINES.push([0,1,2,3,4].map(r=>r*5+c));
LINES.push([0,6,12,18,24],[4,8,12,16,20]);
function render(){
  const wins=LINES.filter(l=>l.every(i=>marked.has(i)));const winSet=new Set(wins.flat());
  cells.forEach((c,i)=>{c.classList.toggle("on",marked.has(i));c.classList.toggle("win",winSet.has(i));c.setAttribute("aria-pressed",marked.has(i))});
  if(wins.length){statusEl.textContent=wins.length>1?`BINGO! ×${wins.length}`:"BINGO!";statusEl.className="status bingo"}
  else{const n=marked.size;statusEl.textContent=n?`${n} marked`:"Tap a square to mark it.";statusEl.className="status"}
  state.marks=[...marked];save();
}
const clearBtn=document.getElementById("clearBtn"),ask=document.getElementById("ask");
clearBtn.onclick=()=>{clearBtn.hidden=true;ask.hidden=false};
document.getElementById("no").onclick=()=>{ask.hidden=true;clearBtn.hidden=false};
document.getElementById("yes").onclick=()=>{marked.clear();render();ask.hidden=true;clearBtn.hidden=false};
render();
</script>
